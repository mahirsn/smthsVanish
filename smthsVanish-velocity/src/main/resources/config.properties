# smthsVanish — Velocity ayarları. Backend'lerle AYNI Redis olmalı.
redis.uri=redis://localhost:6379/0
redis.timeout-ms=2000
# smthsvanish.level.1 .. N ve smthsvanish.see.1 .. N; backend'deki levels.max ile aynı tut.
levels.max=10
# smthsvanish.auto izni olan oyuncu, ilk backend'e bağlanmadan önce vanish olur.
auto-vanish=true
# Sunucu listesindeki oyuncu sayısından ve örnek listeden vanish oyuncuları çıkar.
hide-from-ping=true
